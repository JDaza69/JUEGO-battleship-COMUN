name: Publicar ejecutable Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Probar motor
        run: npm test
      - name: Compilar web
        run: npm run build
      - name: Crear ejecutable portable x64
        run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Probar el juego empaquetado
        run: npm run test:desktop
      - name: Calcular SHA-256
        shell: pwsh
        run: |
          $lines = Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Conservar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Flota-Tactica-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Flota-Tactica-Windows
          path: release
      - name: Publicar descarga en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Flota táctica para Windows x64, en un único ejecutable portable.
          Descarga el archivo .exe de Assets y ábrelo. No requiere Node.js ni instalación.
          La aplicación funciona sin conexión. El ejecutable no tiene firma digital.
          SHA256SUMS.txt permite comprobar la integridad de la descarga.
          NOTES
          gh release create "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt --verify-tag --title "Flota táctica $RELEASE_TAG" --notes-file notes.md
